services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    container_name: actual_server
    ports:
      - '5006:5006'
    volumes:
      - ./data:/data
    healthcheck:
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
